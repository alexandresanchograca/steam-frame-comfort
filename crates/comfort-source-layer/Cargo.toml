[package]
name = "comfort-source-layer"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "vrw_comfort_source"
crate-type = ["cdylib"]

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
bytemuck.workspace = true
comfort-protocol = { path = "../comfort-protocol" }
rustix = { workspace = true, features = ["event", "fs", "net", "process", "time"] }
