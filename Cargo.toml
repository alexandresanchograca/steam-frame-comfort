[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
rustix = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
